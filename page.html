<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indian Card Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:#0b3d24 radial-gradient(circle at top,#14693f,#082a19);color:#f3e7c0;min-height:100vh;text-align:center;padding:12px}
h1,h2{color:#d4af37;margin:8px}
button,input{font:inherit;padding:11px 16px;margin:5px;border-radius:8px;border:1px solid #d4af37}
button{background:#d4af37;color:#241a00;cursor:pointer;min-height:44px}
button:hover{filter:brightness(1.08)}button:disabled{opacity:.45;cursor:not-allowed}
input{background:#fffbea;color:#222;text-transform:none;min-height:44px}
.box{border:2px solid #d4af37;border-radius:14px;padding:14px;margin:10px auto;max-width:430px;background:#0006}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0}
.card{width:clamp(44px,11vw,64px);aspect-ratio:5/7;background:#fff8e1;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:clamp(14px,4vw,20px);box-shadow:0 2px 5px #0008;transition:.15s;user-select:none}
.card.r{color:#b00020}.card.back{background:repeating-linear-gradient(45deg,#7a1c1c,#7a1c1c 4px,#5a1010 4px,#5a1010 8px);color:transparent}
.card.ok{cursor:pointer;outline:3px solid #d4af37}.card.ok:hover{transform:translateY(-7px)}.card.sel{transform:translateY(-10px);outline-color:#fff}.card.dim{opacity:.5}
.me{color:#7dff9f}.good{color:#7dff9f}.bad{color:#ffb4a8}
small{opacity:.82}#msg{min-height:1.4em;color:#ffb4a8;margin:5px}
#connection{font-size:.9em;margin:4px auto 10px}.connected{color:#7dff9f}.connecting{color:#f3e7c0}.disconnected{color:#ffb4a8}
#table{max-width:1000px;margin:auto}.player-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.player-card{border:1px solid #d4af37;border-radius:10px;padding:9px;background:#0005;min-width:145px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}.notice{padding:9px;border-radius:8px;background:#0005;margin:8px auto;max-width:650px}
</style>
</head>
<body>
<h1>INDIAN CARD GAMES</h1>
<div id="connection" class="connected">● Game server ready</div>
<div id="msg"></div>

<div id="home">
  <small>Classic Indian Card Games</small>
  <div class="box"><h2>7–8</h2>2 Players<br><button type="button" onclick="pick('78')">PLAY 7–8</button></div>
  <div class="box"><h2>2–3–5</h2>3 Players<br><button type="button" onclick="pick('235')">PLAY 2–3–5</button></div>
</div>

<div id="entry" hidden class="box">
  <h2 id="et"></h2>
  <input id="name" placeholder="Your name" maxlength="20" autocomplete="name"><br>
  <button id="bc" type="button" onclick="createGame()">CREATE GAME</button>
  <div style="margin:6px">OR</div>
  <input id="code" placeholder="ROOM CODE" maxlength="5" style="text-transform:uppercase"><br>
  <button id="bj" type="button" onclick="joinGame()">JOIN GAME</button><br>
  <button type="button" onclick="backHome()">Back</button>
</div>

<div id="lobby" hidden class="box">
  <h2 id="lt"></h2>
  <div>ROOM <b id="lc" style="font-size:1.6em;letter-spacing:4px"></b></div>
  <div id="lp"></div>
  <p id="lw"></p>
  <div class="actions">
    <button type="button" onclick="copyText(CODE)">COPY CODE</button>
    <button type="button" onclick="copyText(location.origin+'/join/'+CODE)">COPY LINK</button>
    <button type="button" onclick="shareWhatsApp()">WHATSAPP</button>
  </div>
  <button id="go" type="button" onclick="startGame()">START GAME</button>
</div>

<div id="table" hidden></div>

<script>
const $=id=>document.getElementById(id);
const NAME={"78":"7–8","235":"2–3–5"};
let kind="",CODE="",PID="",S=null,selected=[],peeked=null,pollTimer=null,pollBusy=false,msgTimer=null;
const savedKey="indian-card-games-player";

function show(id){["home","entry","lobby","table"].forEach(x=>$(x).hidden=x!==id)}
function msg(t,good=false){$("msg").textContent=t;$("msg").className=good?"good":"";clearTimeout(msgTimer);msgTimer=setTimeout(()=>{$("msg").textContent=""},5000)}
function connection(t,cls){$("connection").textContent=t;$("connection").className=cls}
function pick(k){kind=k;$("et").textContent=NAME[k];show("entry");$("name").focus()}
function backHome(){show("home");kind=""}
function save(){sessionStorage.setItem(savedKey,JSON.stringify({pid:PID,code:CODE,kind:kind}))}
function clearSaved(){sessionStorage.removeItem(savedKey)}
function restore(){try{return JSON.parse(sessionStorage.getItem(savedKey)||"null")}catch{return null}}

async function api(path,body){
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);
  try{
    const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body),signal:controller.signal,cache:"no-store"});
    let d=null;try{d=await r.json()}catch{}
    if(!r.ok||!d||!d.ok)throw new Error((d&&d.error)||("Server error ("+r.status+")"));
    return d;
  }finally{clearTimeout(timer)}
}

async function createGame(){
  const name=$("name").value.trim();
  if(!kind)return msg("Please select a game first.");
  if(!name){$("name").focus();return msg("Please enter your name.")}
  $("bc").disabled=true;$("bj").disabled=true;msg("Creating game…");
  try{
    const d=await api("/api/create",{kind,name});
    PID=d.pid;CODE=d.code;kind=d.kind;S=d.state;save();render();msg("Game created — share room code "+CODE,true);startPolling();
  }catch(e){msg(e.name==="AbortError"?"Server took too long to respond. Please try again.":e.message)}
  finally{$("bc").disabled=false;$("bj").disabled=false}
}

async function joinGame(){
  const code=$("code").value.trim().toUpperCase();const name=$("name").value.trim();
  if(!code)return msg("Enter the room code.");
  if(code.length<5)return msg("Room code must be 5 characters.");
  if(!name)return msg("Please enter your name.");
  $("bc").disabled=true;$("bj").disabled=true;msg("Joining game…");
  try{
    const d=await api("/api/join",{code,name});
    PID=d.pid;CODE=d.code;kind=d.kind;S=d.state;save();render();msg("Joined game successfully!",true);startPolling();
  }catch(e){msg(e.name==="AbortError"?"Server took too long to respond. Please try again.":e.message)}
  finally{$("bc").disabled=false;$("bj").disabled=false}
}

async function refresh(){
  if(!PID||!CODE||pollBusy)return;
  pollBusy=true;
  try{
    const d=await api("/api/state",{pid:PID,code:CODE});
    S=d.state;render();connection("● Connected · live game sync","connected");
  }catch(e){
    if(/session|room/i.test(e.message)){clearSaved();stopPolling();show("home");msg(e.message)}
    else connection("● Reconnecting…","disconnected");
  }finally{pollBusy=false}
}
function startPolling(){stopPolling();refresh();pollTimer=setInterval(refresh,700)}
function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}

async function startGame(){
  msg("Starting game…");
  try{const d=await api("/api/start",{pid:PID,code:CODE});S=d.state;render();msg("Game started!",true)}catch(e){msg(e.message)}
}
async function peekCards(idxs){
  try{const d=await api("/api/peek",{pid:PID,code:CODE,idxs});peeked=d;render()}catch(e){msg(e.message)}
}
async function chooseHukum(suit,idxs=null){
  try{const d=await api("/api/hukum",{pid:PID,code:CODE,suit,idxs});S=d.state;selected=[];peeked=null;render();msg("Hukum selected: "+suit,true)}catch(e){msg(e.message)}
}
async function playCard(card){
  try{const d=await api("/api/play",{pid:PID,code:CODE,card});S=d.state;render()}catch(e){msg(e.message)}
}
async function nextGame(){
  try{const d=await api("/api/next",{pid:PID,code:CODE});S=d.state;render();msg("Next game started!",true)}catch(e){msg(e.message)}
}
function copyText(text){if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>msg("Copied!",true));else msg(text)}
function shareWhatsApp(){open("https://wa.me/?text="+encodeURIComponent("Join my "+NAME[kind]+" game! "+location.origin+"/join/"+CODE),"_blank")}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function card(c,o={}){if(c==null)return el("div","card dim","");const e=el("div","card"+(o.back?" back":"")+("♥♦".includes(c.slice(-1))?" r":"")+(o.ok?" ok":"")+(o.sel?" sel":""),o.back?"":c);if(o.fn)e.onclick=o.fn;return e}

function render(){
  if(!S)return;
  const r=S.room,g=S.game;
  if(!g){
    show("lobby");$("lt").textContent=NAME[r.kind];$("lc").textContent=r.code;
    $("lp").replaceChildren(...r.players.map(p=>el("div",p.host?"me":"",(p.on?"🟢 ":"⚪ ")+p.name+(p.host?" — HOST":""))));
    $("lw").textContent=r.players.length<r.need?"Waiting for players… "+r.players.length+" / "+r.need:"All players present";
    $("go").hidden=!S.host;$("go").disabled=r.players.length<r.need;return;
  }
  show("table");const T=$("table"),N=S.names,nm=p=>N[p]+(p===PID?" (you)":"");T.replaceChildren();
  T.append(el("h2","","HUKUM "+(g.hukum||"—")));
  const st=el("div","player-grid");Object.keys(g.targets).forEach(p=>{const b=el("div","player-card");b.append(el("b",p===PID?"me":"",nm(p)),el("div","","Target "+g.targets[p]+" · Tricks "+g.won[p]),el("small","","Cards "+(g.n[p]+g.up[p].filter(Boolean).length)));if(g.carry[p])b.append(el("small","","Pending shortfall "+g.carry[p]));st.append(b)});T.append(st);
  Object.keys(g.up).filter(p=>p!==PID&&g.up[p].length).forEach(p=>{T.append(el("small","",N[p]+" table cards"));const d=el("div","row");g.up[p].forEach(c=>d.append(c?card(c):el("div","card dim","")));T.append(d)});
  const tr=el("div","box");tr.style.maxWidth="650px";tr.append(el("small","",g.trick.length?"Current trick":(g.last?"Last trick won by "+N[g.last.winner]:"Trick area")));const tr2=el("div","row");(g.trick.length?g.trick:(g.last?g.last.plays:[])).forEach(([p,c])=>{const w=el("div");w.append(card(c),el("small","",N[p]));tr2.append(w)});tr.append(tr2);T.append(tr);
  if(g.phase==="hukum"){
    if(PID===g.sel){
      const b=el("div","box");b.style.maxWidth="620px";
      b.append(el("h3","","Hukum selection"));
      b.append(el("small","","You have your first 5 cards. Choose Hukum now, or inspect exactly 2 of the next 5 cards first."));
      const first=el("div","row");g.hand.forEach(c=>first.append(card(c)));b.append(el("b","","Your first 5 cards"),first);
      const bs=el("div","actions");g.elig.forEach(x=>{const u=el("button","",x);u.onclick=()=>chooseHukum(x);bs.append(u)});b.append(el("small","","Choose Hukum from your first 5:"),bs);
      b.append(el("small","","Or inspect 2 of the next 5 cards:"));
      const nf=el("div","row");for(let i=0;i<5;i++){const selectedNow=selected.includes(i);nf.append(card("?",{back:true,ok:true,sel:selectedNow,fn:()=>{selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i].slice(-2);render();if(selected.length===2)peekCards(selected)}}))}b.append(nf);
      if(g.peeked){
        b.append(el("b","","The 2 cards you inspected"));
        const pc=el("div","row");g.peeked.cards.forEach(c=>pc.append(card(c)));b.append(pc);
        const suits=el("div","actions");[...new Set(g.peeked.cards.map(c=>c.slice(-1)))].forEach(x=>{const u=el("button","",x);u.onclick=()=>chooseHukum(x,g.peeked.idxs);suits.append(u)});
        b.append(el("small","","Choose Hukum from those 2 cards:"),suits);
      }
      T.append(b)
    }else T.append(el("div","notice","Waiting for "+N[g.sel]+" to choose Hukum…"));
  }else if(g.phase==="play")T.append(el("div",g.turn===PID?"notice me":"notice",g.turn===PID?"🟢 YOUR TURN":"Waiting for "+N[g.turn]+"…"));
  else{
    const b=el("div","box");b.append(el("h2","","GAME OVER"));Object.entries(g.result).forEach(([p,x])=>b.append(el("div","",N[p]+": target "+x.target+", made "+x.won+(x.shortfall?", shortfall "+x.shortfall+" (carried to next game)":" ✓"))));if(S.host){const u=el("button","","NEXT GAME");u.onclick=nextGame;b.append(u)}else b.append(el("small","","Host starts the next game"));T.append(b)
  }
  const legal=new Set(g.legal||[]);
  if(g.up[PID]?.length){T.append(el("small","","Your table cards"));const d=el("div","row");g.up[PID].forEach(c=>d.append(c?card(c,{ok:legal.has(c),fn:()=>legal.has(c)&&playCard(c)}):el("div","card dim","")));T.append(d)}
  T.append(el("small","","Your hand"));const h=el("div","row");g.hand.forEach(c=>h.append(card(c,{ok:legal.has(c),fn:()=>legal.has(c)&&playCard(c)})));T.append(h)
}

(function init(){
  const urlCode="{{ code }}";
  if(urlCode){pick("78");$("code").value=urlCode;$("et").textContent="Join room "+urlCode;$("bc").hidden=true}
  const old=restore();
  if(old && (!urlCode || old.code===urlCode)){
    PID=old.pid;CODE=old.code;kind=old.kind||kind;show("lobby");startPolling();
  }
  window.addEventListener("online",()=>{connection("● Back online · syncing","connected");refresh()});
  window.addEventListener("offline",()=>connection("● Internet connection lost","disconnected"));
})();
</script>
</body>
</html>
