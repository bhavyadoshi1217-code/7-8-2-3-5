<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Game</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="panel"><h1>JOIN GAME</h1><p>Room: <strong id="code">{{ code }}</strong></p><input id="name" maxlength="20" placeholder="Your name"><button id="join">JOIN GAME</button><p id="msg"></p></main><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>const socket=io();const code='{{ code }}';document.getElementById('join').onclick=()=>{const name=document.getElementById('name').value.trim();socket.emit('join_game',{code,name});};socket.on('room_joined',d=>location.href='/game/'+d.game_type);socket.on('error_message',d=>document.getElementById('msg').textContent=d.message);</script></body></html>
